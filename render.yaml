services:
  - type: web
    name: reto-01-registro-proveedor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PORT
        value: "3000"
      - key: MAX_TOOL_ITERATIONS
        value: "25"
      - key: MAX_TOKENS_PER_SESSION
        value: "80000"
